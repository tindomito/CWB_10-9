      <path d="M 848 784 L 848 848 L 784 848"/>
    </g>
    
    <!-- Número 10 -->
    <text x="512" y="440" font-family="Oswald, Arial Black, sans-serif" font-weight="700" font-size="320" fill="#F5F5F5" text-anchor="middle" letter-spacing="-14">10</text>
    
    <!-- Guión borgoña -->
    <rect x="336" y="500" width="352" height="28" fill="#7A0A1C" rx="4"/>
    
    <!-- Número 9 -->
    <text x="512" y="800" font-family="Oswald, Arial Black, sans-serif" font-weight="700" font-size="320" fill="#D4AF37" text-anchor="middle" letter-spacing="-14">9</text>
